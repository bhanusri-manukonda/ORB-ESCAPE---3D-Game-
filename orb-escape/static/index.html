<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Orb Escape – 3D Block Puzzle</title><link rel="stylesheet" href="style.css"></head>
<body class="home">
<header class="bar"><button id="menu" class="ib" title="Menu">☰</button><div class="logo">ORB<b>ESCAPE</b></div>
<div id="stats"><span>Level <b id="sl">1</b></span><span>Moves <b id="sm">0</b>/<b id="slim">0</b></span><span>Par <b id="spar">0</b></span><span>Score <b id="ss">0</b></span><span>⏱ <b id="stime">0:00</b></span></div>
<div class="tools"><button id="undo" title="Undo">↶</button><button id="hint" title="Hint">💡</button><button id="reset" title="Restart">⟲</button><button id="pause" title="Pause">⏸</button></div></header>
<main id="app"></main>
<div id="owl"><div id="say">Hoot! Free the orb!</div>🦉</div>
<div id="modal"><div class="card" id="card"></div></div>
<script src="game.js"></script></body></html>
